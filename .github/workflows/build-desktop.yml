name: Build desktop installer

# Windows is the supported Chronexa desktop platform. Tagged builds publish the
# installer straight to the GitHub Release, avoiding duplicate Actions storage.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Build Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish Windows installer
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
