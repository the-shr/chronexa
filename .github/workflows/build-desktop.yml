name: Build desktop installers

# Builds the Windows (.exe) and macOS (.dmg) installers in the cloud, since a
# macOS build cannot be produced on Windows. Push a version tag to cut a
# release, or run it by hand from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build installer
        run: npm run dist
        env:
          # No Apple certificate, so do not try to sign -- the build stays
          # unsigned, which is fine for handing out internally.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: chronexa-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
          if-no-files-found: ignore

  # On a version tag, gather both installers into one GitHub Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
