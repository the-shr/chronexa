name: Build desktop installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: npm ci --prefix desktop
      - run: node desktop/node_modules/vite/bin/vite.js build --config android-web/vite.config.mjs
      - name: Build and lint Android app
        working-directory: android
        run: gradle assembleRelease lintRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: chronexa-android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-release.*
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise consent, screenshots, recording, lock and offline recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          working-directory: android
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-report
          path: android/app/build/reports/androidTests/
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: android
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: chronexa-release-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Check published release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" -Headers $headers
            $skip = -not $release.draft
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            $skip = $false
          }
          "skip=$($skip.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
        if: steps.existing.outputs.skip != 'true'

      - name: Build Windows installer
        if: steps.existing.outputs.skip != 'true'
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Prepare automatic update metadata
        if: steps.existing.outputs.skip != 'true'
        run: node scripts/release-manifest.cjs

      - name: Upload complete release
        if: steps.existing.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: desktop/update-notes.txt
          files: |
            desktop/release/Chronexa.Setup.*.exe
            desktop/release/update.json
            desktop/release/SHA256SUMS.txt

      # Publishing happens after the Android APK is signed locally and both
      # platform manifests and checksums have been verified in the draft.
