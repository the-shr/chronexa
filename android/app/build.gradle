plugins { id 'com.android.application' }
def releaseVersion = new groovy.json.JsonSlurper().parse(file('../../desktop/package.json')).version
def parts = releaseVersion.tokenize('.').collect { it.toInteger() }
android {
    namespace 'com.brandmacros.chronexa'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'com.brandmacros.chronexa'; minSdk 26; targetSdk 35; versionCode parts[0]*1000000+parts[1]*1000+parts[2]; versionName releaseVersion; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
